name: Deploy to Velixir

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Velixir CLI
        run: |
          curl -fsSL https://velixir.net/install.sh | sh
          echo "$HOME/.velixir/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.velixir/bin:$PATH"
          velixir --version

      - name: Login and Deploy to Velixir
        env:
          VELIXIR_API_KEY: ${{ secrets.VELIXIR_API_KEY }}
        run: |
          velixir login --token="$VELIXIR_API_KEY"
          velixir deploy --prod --app 3ad5283b-0d07-424c-851c-04257424aa25