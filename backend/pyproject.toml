[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aion"
version = "0.1.0"
description = "Aion AI Assistant"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "python-dotenv",
    "groq"
]

[tool.setuptools]
py-modules = ["main"]